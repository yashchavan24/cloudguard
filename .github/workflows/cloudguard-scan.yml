name: CloudGuard Security Scan

# Runs CloudGuard against Terraform in this repo on every push/PR,
# and uploads the results as SARIF so they show up as native
# annotations in GitHub's Security > Code scanning tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required to upload SARIF results

jobs:
  cloudguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CloudGuard
        run: pip install -e .

      - name: Run CloudGuard scan (Terraform)
        run: |
          cloudguard scan --path ./terraform --format sarif --output cloudguard-results.sarif
        continue-on-error: true   # don't block SARIF upload if issues are found

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cloudguard-results.sarif

      - name: Fail build on critical/high findings
        run: |
          cloudguard scan --path ./terraform --fail-on high
